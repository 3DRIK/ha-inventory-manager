remove_item:
  name: Odstrániť položku
  description: Odstráni položku z inventára.
  fields:
    item_id:
      name: ID položky
      required: true
      selector:
        text:

consume:
  name: Spotrebovať
  description: Zníži počet kusov danej položky (napr. po spotrebovaní).
  fields:
    item_id:
      name: ID položky
      required: true
      selector:
        text:
    amount:
      name: Množstvo
      default: 1
      selector:
        number:
          min: 0
          step: 0.1

restock:
  name: Doplniť zásoby
  description: Zvýši počet kusov danej položky (napr. po nákupe).
  fields:
    item_id:
      name: ID položky
      required: true
      selector:
        text:
    amount:
      name: Množstvo
      default: 1
      selector:
        number:
          min: 0
          step: 0.1

add_location:
  name: Pridať miestnosť
  description: Pridá novú miestnosť/úložisko (napr. Špajza, Skrinka).
  fields:
    name:
      name: Názov miestnosti
      required: true
      selector:
        text:

remove_location:
  name: Odstrániť miestnosť
  description: Odstráni miestnosť. Položky sa presunú do prvej zostávajúcej miestnosti.
  fields:
