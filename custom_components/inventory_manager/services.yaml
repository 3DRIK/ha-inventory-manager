add_item:
  name: Pridať položku
  description: Pridá novú položku do inventára.
  fields:
    name:
      name: Názov
      required: true
      selector:
        text:
    location:
      name: Miestnosť
      required: true
      selector:
        text:
    quantity:
      name: Počet
      default: 1
      selector:
        number:
          min: 0
          step: 0.1
    unit:
      name: Jednotka
      example: "ks, kg, l"
      selector:
        text:
    expiration:
      name: Dátum exspirácie
      selector:
        date:
    threshold:
      name: Prah nízkeho stavu
      description: Ak počet klesne na túto hodnotu alebo nižšie, položka sa označí ako "nízky stav".
      selector:
        number:
          min: 0
          step: 0.1
    category:
      name: Kategória
      selector:
        text:
    notes:
      name: Poznámka
      selector:
        text:

